name: Windows compatibility

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository compatibility tests
        shell: powershell
        run: python -m unittest discover -s tests -v
      - name: Test DingTalk Windows authorization
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File plugins/dingtalk/scripts/test-local-auth.ps1
      - name: Test Lark native command boundary
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File plugins/lark/scripts/test-native-command.ps1
      - name: Test WeCom native command boundary
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File plugins/wecom/scripts/test-native-command.ps1
